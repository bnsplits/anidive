[package]
name = "anidive"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
tui-input = "0.15.5"
throbber-widgets-tui = "0.11.1"
scraper = "0.27.0"
reqwest = { version = "0.13.5", features = ["blocking", "form", "json"] }
regex = "1.13.1"
serde_json = "1.0.154"
which = "8.0.6"
aes = "0.9.3"
cbc = "0.2.1"
hex = "0.4.3"
base64 = "0.23.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
